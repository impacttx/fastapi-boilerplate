services:
  db:
    image: postgres:18-alpine
    container_name: fastapi_benchmark_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-benchmark_db}
    ports:
      - "5432:5432"
    volumes:
      # PG 18+ images store data under /var/lib/postgresql/<version>/,
      # so mount the whole data root (postgres:18 image requirement).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_benchmark_app
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-benchmark_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-benchmark-secret-key-fastapi-vs-axum}
      ENVIRONMENT: production
      # --- JWT (dev-only benchmark keypair; generate your own for real deployments) ---
      JWT_ALGORITHM: RS256
